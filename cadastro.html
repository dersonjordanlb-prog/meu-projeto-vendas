<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Lopes Brandão</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            background: #0d1117; 
            color: #c9d1d9;
            min-height: 100vh;
            margin: 0;
        }
        .login-container { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #ffffff; margin-top: 0; font-size: 24px; margin-bottom: 20px; }
        input { 
            display: block; 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 12px; 
            box-sizing: border-box; 
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
        }
        input:focus {
            border-color: #deff9a;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: #bdde79; }
        p { color: #8b949e; font-size: 14px; margin-top: 20px; }
        a { color: #deff9a; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Criar Nova Conta</h2>
        <input type="email" id="email" placeholder="Seu melhor e-mail">
        <input type="password" id="password" placeholder="Crie uma senha (mín. 6 dígitos)">
        <button id="btnCadastrar">Cadastrar e Ir para Pagamento</button>
        <p>Já tem conta e chave? <a href="ativar.html">Ativar Acesso</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRGyFAEcTRagke7LcQKIeGzl07mQbZVro",
            authDomain: "meusistemalogin-d74e9.firebaseapp.com",
            projectId: "meusistemalogin-d74e9",
            storageBucket: "meusistemalogin-d74e9.firebasestorage.app",
            messagingSenderId: "260496003658",
            appId: "1:260496003658:web:705567a2e3e23937000cb3",
            measurementId: "G-NMGG5EY6J9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btnCadastrar').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;

            if(!email || !senha) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;

                // Salva no seu Firebase que este usuário acabou de se cadastrar
                await setDoc(doc(db, "usuarios", user.uid), {
                    email: email,
                    temLicenca: false, 
                    dataCadastro: new Date()
                });

                alert("Conta criada com sucesso! Redirecionando para o pagamento...");
                
                // MUDANÇA DO SEU NOVO FLUXO: Envia direto para o seu WhatsApp com mensagem pronta
                // Lembra de trocar o número abaixo pelo teu número real com código do país!
                window.location.href = "https://wa.me/351933093835?text=Olá%20Derson,%20já%20criei%20a%20minha%20conta%20com%20o%20e-mail%20" + encodeURIComponent(email) + ".%20Quero%20fazer%20o%20pagamento%20para%20receber%20a%20minha%20chave!"; 

            } catch (error) {
                alert("Erro ao cadastrar: " + error.message);
            }
        });
    </script>
</body>
</html>
