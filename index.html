<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edições de Alta Qualidade</title>

<style>

body {

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

background: #0d1117;

color: #c9d1d9;

margin: 0;

padding: 20px;

display: flex;

justify-content: center;

align-items: center;

min-height: 100vh;

}



/* Estilo do Card Principal */

.card-produto {

background: #161b22;

border: 1px solid #30363d;

border-radius: 12px;

padding: 30px;

text-align: center;

box-shadow: 0 4px 20px rgba(0,0,0,0.5);

width: 100%;

max-width: 360px;

transition: transform 0.2s, border-color 0.2s;

}



.card-produto:hover {

transform: translateY(-5px);

border-color: #deff9a;

}



/* Espaço da Imagem de Capa (Onde estava a caneta) */

.preview-media {

width: 100%;

height: 200px;

background: #21262d;

border-radius: 8px;

margin-bottom: 20px;

object-fit: cover; /* Faz a imagem encaixar perfeitamente sem distorcer */

border: 1px solid #30363d;

}



.card-produto h2 {

color: #ffffff;

margin: 15px 0 10px 0;

font-size: 22px;

line-height: 1.3;

}



.card-produto p {

color: #8b949e;

font-size: 14px;

line-height: 1.5;

margin-bottom: 20px;

}



.preco {

font-size: 24px;

font-weight: bold;

color: #ffffff;

margin-bottom: 20px;

}



/* Botão Quero Acesso Imediato */

.btn-acesso {

display: block;

width: 100%;

padding: 14px 0;

background: #ffffff;

color: #0d1117;

border: none;

border-radius: 6px;

font-size: 16px;

font-weight: bold;

text-decoration: none;

cursor: pointer;

transition: background 0.2s;

box-sizing: border-box;

}



.btn-acesso:hover {

background: #deff9a; /* Muda para o verde neon ao passar o rato */

}

</style>

</head>

<body>



<div class="card-produto">


<img class="preview-media" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" alt="Preview do Pack">



<h2>Edições de fotos e Vídeos After Effects / CapCut</h2>


<p>Tenha Acesso a várias edição de alta qualidade.</p>


<div class="preco">1.5€,00</div>



<a href="cadastro.html" class="btn-acesso">Quero Acesso Imediato</a>



</div>



</body>

</html>
