<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Portal VIP</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 360px;
            width: 100%;
        }
        h2 { color: #ffffff; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            color: white; 
            box-sizing: border-box;
        }
        .btn-entrar { 
            width: 100%; 
            padding: 12px; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px;
        }
        .btn-entrar:hover { background: #bdde79; }
        .divider { margin: 20px 0; color: #8b949e; font-size: 14px; }
        .btn-visitante { 
            display: inline-block;
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            color: #deff9a; 
            border: 1px solid #deff9a; 
            border-radius: 6px; 
            font-weight: bold; 
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-visitante:hover { background: rgba(222, 255, 154, 0.1); }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Área de Membros</h2>
        <input type="email" id="email" placeholder="Teu Email">
        <input type="password" id="password" placeholder="Tua Palavra-passe">
        <button class="btn-entrar" onclick="alert('Sistema de login da Firebase será conectado em breve! Usa o acesso de visitante abaixo por agora.')">Entrar na Conta</button>
        
        <div class="divider">ou se preferires</div>
        
        <a href="painel.html" class="btn-visitante">Entrar como Visitante 👀</a>
    </div>

</body>
</html>
