<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso VIP - Packs de Edição</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .auth-card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 30px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: #deff9a; margin-bottom: 10px; }
        .auth-card p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #8b949e; font-size: 13px; }
        .input-group input { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
            outline: none;
        }
        .input-group input:focus { border-color: #deff9a; }
        
        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        .btn-submit:hover { background: #bdde79; }
        
        .toggle-text { margin-top: 20px; font-size: 13px; color: #8b949e; }
        .toggle-text a { color: #deff9a; text-decoration: none; font-weight: bold; cursor: pointer; }
        .toggle-text a:hover { text-decoration: underline; }

        .mensagem-erro { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }
        .mensagem-sucesso { color: #deff9a; font-size: 13px; margin-top: 10px; display: none; }
    </style>

    <!-- SDKs do Firebase v8 (Mais simples e compatíveis com código direto) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

    <div class="auth-card">
        <h2 id="form-titulo">Área VIP</h2>
        <p id="form-subtitulo">Inicia sessão para acederes aos teus packs exclusivos.</p>

        <form id="auth-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="teuemail@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" placeholder="******" required>
            </div>

            <button type="submit" id="btn-acao" class="btn-submit">Entrar</button>
        </form>

        <div id="msg-erro" class="mensagem-erro"></div>
        <div id="msg-sucesso" class="mensagem-sucesso"></div>

        <div class="toggle-text">
            <span id="toggle-pergunta">Ainda não tens conta?</span> 
            <a id="btn-toggle" onclick="alternarModo()">Criar Conta</a>
        </div>
    </div>

    <script>
        // 1. As tuas credenciais reais do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBniTKymd0rt1ywm-wBK-T9p2hOMIR8Psk",
            authDomain: "packs-no-free.firebaseapp.com",
            projectId: "packs-no-free",
            storageBucket: "packs-no-free.firebasestorage.app",
            messagingSenderId: "1039609086871",
            appId: "1:1039609086871:web:37d9deb1d7f0b3aa507ad2"
        };

        // 2. Inicializar o Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let modoCriarConta = false;

        // Alternar entre Login e Criar Conta
        function alternarModo() {
            modoCriarConta = !modoCriarConta;
            const titulo = document.getElementById('form-titulo');
            const subtitulo = document.getElementById('form-subtitulo');
            const btnAcao = document.getElementById('btn-acao');
            const pergunta = document.getElementById('toggle-pergunta');
            const btnToggle = document.getElementById('btn-toggle');
            
            esconderMensagens();

            if (modoCriarConta) {
                titulo.innerText = "Criar Conta VIP";
                subtitulo.innerText = "Regista-te para teres acesso à plataforma.";
                btnAcao.innerText = "Registar";
                pergunta.innerText = "Já tens uma conta?";
                btnToggle.innerText = "Fazer Login";
            } else {
                titulo.innerText = "Área VIP";
                subtitulo.innerText = "Inicia sessão para acederes aos teus packs exclusivos.";
                btnAcao.innerText = "Entrar";
                pergunta.innerText = "Ainda não tens conta?";
                btnToggle.innerText = "Criar Conta";
            }
        }

        function esconderMensagens() {
            document.getElementById('msg-erro').style.display = 'none';
            document.getElementById('msg-sucesso').style.display = 'none';
        }

        // Submeter formulário (Login ou Registo)
        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            esconderMensagens();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('msg-erro');
            const msgSucesso = document.getElementById('msg-sucesso');

            if (modoCriarConta) {
                // Criar Novo Utilizador no Firebase
                auth.createUserWithEmailAndPassword(email, senha)
                    .then((userCredential) => {
                        msgSucesso.innerText = "Conta criada com sucesso! A redirecionar...";
                        msgSucesso.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = "painel.html";
                        }, 1500);
                    })
                    .catch((error) => {
                        msgErro.innerText = "Erro ao criar conta: " + error.message;
                        msgErro.style.display = 'block';
                    });
            } else {
                // Fazer Login no Firebase
                auth.signInWithEmailAndPassword(email, senha)
                    .then((userCredential) => {
                        msgSucesso.innerText = "Login efetuado! A entrar...";
                        msgSucesso.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = "painel.html";
                        }, 1500);
                    })
                    .catch((error) => {
                        msgErro.innerText = "Email ou palavra-passe incorretos!";
                        msgErro.style.display = 'block';
                    });
            }
        });
    </script>

</body>
</html>
