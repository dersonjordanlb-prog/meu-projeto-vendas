<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Videos , Qualidades desde 780P até 4K</title>
    <style>
        /* Estilo Dark e Moderno */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            margin: 0;
            color: #deff9a; /* Tom verde/neon exclusivo */
            font-size: 24px;
        }

        .vitrine-container { 
            max-width: 800px; 
            width: 90%; 
            padding: 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .produto-card { 
            background: #161b22; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            text-align: center;
            max-width: 450px;
            transition: transform 0.2s;
        }

        .produto-card:hover {
            transform: translateY(-5px);
            border-color: #deff9a;
        }

        /* Espaço para simular a capa do teu livro/produto */
        .produto-capa {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #21262d, #0d1117);
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #30363d;
        }

        .produto-capa span {
            font-size: 50px;
        }

        h2 { color: #ffffff; margin-top: 0; font-size: 22px; }
        
        .descricao { 
            color: #8b949e; 
            font-size: 15px; 
            line-height: 1.6; 
            margin-bottom: 25px; 
        }

        .preco {
            font-size: 24px;
            color: #deff9a;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-comprar { 
            display: inline-block;
            width: 100%; 
            padding: 14px; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px;
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-comprar:hover { 
            background: #bdde79; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Edição CC and Afeter efects• Portal Oficial</h1>
    </header>

    <div class="vitrine-container">
        <div class="produto-card">
            <div class="produto-capa">
                <span>✒️</span>
            </div>
            <h2>Edições de fotos e Videos Afeter Efects/ CapCut</h2>
            <p class="descricao">
               Tenha Acesso a varias edicão de alta qualidade.
            </p>
            <div class="preco">1.5€,00</div>
            
            <button class="btn-comprar" onclick="irParaCadastro()">Quero Acesso Imediato</button>
        </div>
    </div>

    <script>
        function irParaCadastro() {
            // Guarda a informação de que o cliente quer comprar o Produto 1
            localStorage.setItem('intencao_compra', 'true');
            // Redireciona para a página de registo/cadastro
            window.location.href = "cadastro.html";
        }
    </script>
</body>
</html>
