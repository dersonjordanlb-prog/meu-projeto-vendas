<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Vídeos - Visualização Livre</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .header { text-align: center; margin: 30px 0; }
        .header h1 { color: #deff9a; margin-bottom: 5px; }
        .header p { color: #8b949e; margin: 0; }
        
        .grid-produtos { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            width: 100%; 
            max-width: 1100px; 
            margin-top: 20px;
        }
        .card-produto { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .preview-media { 
            width: 100%; 
            height: 180px; 
            background: #0d1117; 
            border-radius: 8px; 
            object-fit: cover; 
            border: 1px solid #21262d; 
            margin-bottom: 15px;
        }
        .card-produto h3 { color: #ffffff; margin: 10px 0; }
        .card-produto p { color: #8b949e; font-size: 13px; margin-bottom: 15px; }
        
        .btn-download { 
            display: inline-block; 
            width: 100%; 
            padding: 12px 0; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none;
        }
        .btn-download:hover { background: #bdde79; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 Área de Vídeos - Packs Exclusivos</h1>
        <p>Dá o "Play" para assistir à demonstração. O download requer chave VIP.</p>
    </div>

    <div class="grid-produtos">
        
        <div class="card-produto">
            <video class="preview-media" controls poster="https://wallpaperaccess.com/full/1533411.jpg">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                O teu navegador não suporta vídeos.
            </video>
            <h3>Pack de Vídeos Drill/Mystery</h3>
            <p>Clipes em alta fidelidade para transições e fundos de edits de luxo.</p>
            <button onclick="verificarAcesso('https://drive.google.com/drive/folders/1lxNN9Lp4h4CALpnztlEtaM7geKrOSziC')" class="btn-download">Descarregar Pack</button>
        </div>

        </div>

    <script>
        function verificarAcesso(linkDoDrive) {
            var senhaDigitada = prompt("Insira a palavra-passe VIP para libertar o download:");
            
            if (senhaDigitada === "Lopes2025") {
                alert("Acesso concedido! A abrir o teu Google Drive...");
                window.open(linkDoDrive, '_blank');
            } else if (senhaDigitada === null) {
                return; // Se o cliente cancelar, não faz nada
            } else {
                var irParaWhats = confirm("Palavra-passe incorreta!\n\nNão tens a chave de acesso? Clica em 'OK' para falar comigo no WhatsApp e comprar o teu acesso VIP.");
                if (irParaWhats) {
                    // Configura aqui o teu número real com o indicativo (ex: 351 para Portugal)
                    window.open("https://wa.me/351933093835?text=Olá!+Quero+comprar+a+palavra-passe+para+o+Pack.", '_blank');
                }
            }
        }
    </script>

</body>
</html>
