<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ativar Acesso</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #161b22; padding: 30px; border-radius: 10px; width: 300px; text-align: center; border: 1px solid #30363d; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { width: 100%; padding: 10px; background: #deff9a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ativar Chave</h2>
        <input type="text" id="chaveInput" placeholder="Digite sua chave...">
        <button id="btnAtivar">Ativar Acesso</button>
        <p id="status"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRGyFAEcTRagke7LcQKIeGzl07mQbZVro",
            authDomain: "meusistemalogin-d74e9.firebaseapp.com",
            projectId: "meusistemalogin-d74e9",
            storageBucket: "meusistemalogin-d74e9.firebasestorage.app",
            messagingSenderId: "260496003658",
            appId: "1:260496003658:web:705567a2e3e23937000cb3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnAtivar').addEventListener('click', async () => {
            const chaveDigitada = document.getElementById('chaveInput').value.trim();
            const status = document.getElementById('status');
            
            status.innerText = "A verificar...";

            try {
                // Busca a chave global no Firestore
                const docRef = doc(db, "chaves", "global");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const chaveCorreta = docSnap.data().valor; // Certifica-te que no Firebase o campo se chama 'valor'
                    
                    if (chaveDigitada === chaveCorreta) {
                        status.innerText = "Sucesso! Redirecionando...";
                        window.location.href = "painel.html"; 
                    } else {
                        status.innerText = "Chave incorreta!";
                    }
                } else {
                    status.innerText = "Erro: Configuração não encontrada no banco.";
                }
            } catch (error) {
                status.innerText = "Erro: " + error.message;
            }
        });
    </script>
</body>
</html>
