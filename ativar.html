<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativar Acesso - Lopes Brandão</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            background: #0d1117; 
            color: #c9d1d9;
            min-height: 100vh;
            margin: 0;
        }
        .card { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .status-topo {
            background: #21262d;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
            color: #8b949e;
        }
        h1 { color: #ffffff; margin-top: 0; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; line-height: 1.5; }
        input { 
            display: block; 
            width: 100%; 
            margin: 20px 0 15px 0; 
            padding: 12px; 
            box-sizing: border-box; 
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }
        input:focus {
            border-color: #deff9a;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #deff9a; 
            color: #0d1117; 
            border: none; 
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #bdde79; }
        .btn-secondary {
            background: transparent;
            color: #8b949e;
            border: 1px solid #30363d;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #21262d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="status" class="status-topo">Verificando utilizador...</div>
        
        <div id="blocoAtivacao">
            <h1>Insira sua Chave VIP</h1>
            <p>Introduza o código de acesso que recebeu para desbloquear o produto e iniciar a sua jornada.</p>
            
            <input type="text" id="chaveInput" placeholder="DIGITE SUA CHAVE AQUI">
            
            <button id="btnAtivar">Ativar Acesso</button>
            <button onclick="window.location.href='index.html'" class="btn-secondary">Voltar à Vitrine</button>
        </div>
    </div>
